<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your link back to Bearing</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F4ED;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Here's your link. It takes you straight back in.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F7F4ED;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
        <tr>
          <td align="center" style="padding:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.2;color:#262420;">Bearing</td>
        </tr>
        <tr>
          <td style="background-color:#FFFFFF;border:1px solid #E5E1D5;border-radius:20px;padding:40px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.25;color:#262420;padding:0 0 12px;">Welcome back</td>
              </tr>
              <tr>
                <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#56534D;padding:0 0 28px;">Here's your link. It takes you straight back in, and to exactly where you stopped if you left something unfinished.</td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 16px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background-color:#262420;color:#F7F4ED;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1;text-decoration:none;padding:16px 32px;border-radius:999px;">Continue</a>
                </td>
              </tr>
              <tr>
                <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#6B675F;">The link works for 24 hours, on any device.</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 16px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#6B675F;">If you didn't request this, you can ignore this email.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
